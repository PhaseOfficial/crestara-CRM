<!doctype html>
<html class="h-full overflow-hidden bg-surface-base" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Crestara CRM</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Crestara CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      window.__APP_MOUNTED__ = false;
      // Polyfill Object.hasOwn immediately before any module parses
      if (typeof Object.hasOwn !== 'function') {
        Object.hasOwn = function (obj, prop) {
          if (obj == null) {
            throw new TypeError('Cannot convert undefined or null to object');
          }
          return Object.prototype.hasOwnProperty.call(Object(obj), prop);
        };
      }
      // Fail-safe global error catcher to prevent silent white-screens
      window.addEventListener('error', function (event) {
        if (!window.__APP_MOUNTED__) {
          console.error('[Crestara Startup Error]', event.error || event.message);
          var appEl = document.getElementById('app');
          if (appEl && (!appEl.children || appEl.children.length === 0)) {
            appEl.innerHTML =
              '<div style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #f8fafc; color: #1e293b; padding: 24px;">' +
              '<div style="max-width: 440px; width: 100%; background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; text-align: center;">' +
              '<img src="/crestara_logo.png" alt="Crestara CRM" style="height: 40px; margin: 0 auto 16px; object-fit: contain;" />' +
              '<h2 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Notice during initialization</h2>' +
              '<p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">' +
              (event.message || 'An initialization error occurred. Please reload to retry.') +
              '</p>' +
              '<button onclick="window.location.reload(true)" style="background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;">Reload Application</button>' +
              '</div></div>';
          }
        }
      });
    </script>
  </head>
  <body class="h-full overflow-hidden bg-surface-base text-ink-gray-9 sm:overscroll-y-none no-scrollbar">
    <div id="app" class="h-full overflow-hidden bg-surface-base"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
